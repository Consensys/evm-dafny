name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]


jobs:
  build-java:
    runs-on: ubuntu-latest    
    steps:
        # Setup
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: adopt
          cache: 'gradle'        
      - uses: dafny-lang/setup-dafny-action@f2a62432e820c6b0519d308c440b88d7eee411e4 # v1.7.0
        with:
          dafny-version: "4.8.1"
      - name: Set DAFNY_HOME
        run: echo "DAFNY_HOME=$(dirname $(which dafny))" >> $GITHUB_ENV
        # Build
      - name: Gradle Build
        run: gradle --no-daemon build -Prandomize=5
        # Report
      - name: Verification Logs (EVM)
        if: always()
        run: gradle --no-daemon debug --args="build/logs/verify.csv"
      - name: Verification Logs (Proofs)
        if: always()
        run: gradle --no-daemon debug --args="build/logs/test_*.csv"

  test-z3-4-8-5:
    runs-on: ubuntu-latest    
    steps:
        # Setup
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: adopt
          cache: 'gradle'    
      - uses: dafny-lang/setup-dafny-action@f2a62432e820c6b0519d308c440b88d7eee411e4 # v1.7.0
        with:
          dafny-version: "4.8.1"
      - name: Set DAFNY_HOME
        run: echo "DAFNY_HOME=$(dirname $(which dafny))" >> $GITHUB_ENV
        # Build
      - name: Gradle Test
        run: gradle --no-daemon test -Prandomize=5 -Psolver-path=$DAFNY_HOME/z3/bin/z3-4.8.5
        # Report
      - name: Verification Logs (EVM)
        if: always()
        run: gradle --no-daemon debug --args="build/logs/verify.csv"
      - name: Verification Logs (Proofs)
        if: always()
        run: gradle --no-daemon debug --args="build/logs/test_*.csv"
